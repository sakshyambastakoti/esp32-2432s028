; PlatformIO Project Configuration File
; Project: ESP32-2432S028 (CYD) Digital ID Badge & Access Card
; Board: ESP32 Dev Module (Cheap Yellow Display - 2.8" TFT 240x320)

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Serial Monitor Settings
monitor_speed = 115200

; Fast Upload Speed (change to 115200 if upload fails)
upload_speed = 921600

; CPU and Flash Optimizations
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.partitions = huge_app.csv

; Required Libraries (automatically downloaded by PlatformIO)
lib_deps =
    lovyan03/LovyanGFX @ ^1.2.32

; Compiler Flags
build_flags =
    -D CORE_DEBUG_LEVEL=0
    -O2
